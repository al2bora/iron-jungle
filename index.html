const e1rm = (w, r) => (r <= 1 ? w : w * (1 + r / 30)); // Epley
const fmtDate = (d) => new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric" });

  { id: "bench", name: "Bench Press", muscle: "Chest", equipment: "Barbell" },
  { id: "squat", name: "Back Squat", muscle: "Legs", equipment: "Barbell" },
  { id: "deadlift", name: "Deadlift", muscle: "Back", equipment: "Barbell" },

const SAMPLE_WORKOUTS = (() => {
  const out = [];
  const base = { bench: 60, squat: 80, deadlift: 100, ohp: 40, row: 60 };
  for (let i = 0; i < 8; i++) {
    const d = new Date();
    d.setDate(d.getDate() - (8 - i) * 4);
    const exercises = Object.keys(base).slice(i % 2 === 0 ? 0 : 2, i % 2 === 0 ? 3 : 5).map((ex) => {
      const w = base[ex] + i * 2.5;
      return {
        exerciseId: ex,
        sets: [0, 1, 2].map(() => ({ weight: w, reps: 6 + (i % 3), done: true })),
      };
    });
    out.push({ id: uid(), date: d.toISOString().slice(0, 10), exercises });
  }
  return out;
})();

const Btn = ({ children, onClick, variant = "primary", style, disabled, type = "button" }) => {

const LineChart = ({ points, label }) => {
  if (points.length < 2)
    return <p style={{ color: "#9ca3af" }}>Log at least 2 sessions for this exercise to see a trend.</p>;
  const W = 320, H = 160, P = 28;
  const xs = points.map((_, i) => i);
  const ys = points.map((p) => p.value);
  const minY = Math.min(...ys) * 0.95, maxY = Math.max(...ys) * 1.05;
  const x = (i) => P + (i / (xs.length - 1)) * (W - P * 2);
  const y = (v) => H - P - ((v - minY) / (maxY - minY || 1)) * (H - P * 2);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i)},${y(p.value)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", maxHeight: 200 }} role="img" aria-label={label}>
      <path d={path} fill="none" stroke="#dc2626" strokeWidth="2.5" />
      {points.map((p, i) => (
        <circle key={i} cx={x(i)} cy={y(p.value)} r="4" fill="#dc2626">
          <title>{`${fmtDate(p.date)}: ${p.value.toFixed(1)}`}</title>
        </circle>
      ))}
      <text x={P} y={H - 6} fill="#9ca3af" fontSize="10">{fmtDate(points[0].date)}</text>
      <text x={W - P} y={H - 6} fill="#9ca3af" fontSize="10" textAnchor="end">{fmtDate(points[points.length - 1].date)}</text>
    </svg>
  );
};

const BarChart = ({ data }) => {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div>
      {data.map((d) => (
        <div key={d.label} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
          <span style={{ width: 80, fontSize: 13, color: "#d1d5db" }}>{d.label}</span>
          <div style={{ flex: 1, background: "#1c1c1c", borderRadius: 6, height: 14 }}>
            <div style={{ width: `${(d.value / max) * 100}%`, background: "#dc2626", height: 14, borderRadius: 6 }} />
          </div>
          <span style={{ width: 70, textAlign: "right", fontSize: 12, color: "#9ca3af" }}>{Math.round(d.value)}</span>
        </div>
      ))}
    </div>
  );
};

// Number input that lets you fully clear the field and type a fresh value.
const NumInput = ({ label, value, onCommit, decimal = false }) => {
  const [text, setText] = useState(null); // null = not editing, show committed value
  const shown = text !== null ? text : String(Math.round(value * 100) / 100);
  return (
    <input
      aria-label={label}
      type="text"
      inputMode={decimal ? "decimal" : "numeric"}
      value={shown}
      onFocus={(e) => { setText(String(Math.round(value * 100) / 100)); e.target.select(); }}
      onChange={(e) => {
        const raw = e.target.value.replace(",", ".");
        if (decimal ? /^\d*\.?\d*$/.test(raw) : /^\d*$/.test(raw)) {
          setText(raw);
          if (raw !== "" && raw !== ".") onCommit(Number(raw));
        }
      }}
      onBlur={() => {
        if (text === "" || text === "." || text === null) onCommit(0);
        setText(null);
      }}
      style={inputStyle}
    />
  );
};

// ---------- Storage (browser localStorage; falls back to memory if unavailable) ----------
const store = (() => {
  const mem = {};
  let ls = null;
  try {
    window.localStorage.setItem("__lift_test", "1");
    window.localStorage.removeItem("__lift_test");
    ls = window.localStorage;
  } catch (e) { ls = null; }
  return {
    get: (k) => {
      try {
        if (ls) { const v = ls.getItem(k); return v === null ? null : JSON.parse(v); }
        return k in mem ? mem[k] : null;
      } catch (e) { return null; }
    },
    set: (k, v) => {
      try { if (ls) ls.setItem(k, JSON.stringify(v)); else mem[k] = v; } catch (e) {}
    },
    del: (k) => {
      try { if (ls) ls.removeItem(k); else delete mem[k]; } catch (e) {}
    },
  };
})();

// Simple non-cryptographic PIN hash (this is device-local, not a security boundary)
const hashPin = (pin) => {
  let h = 2166136261;
  for (const c of "liftlog:" + pin) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
};

const defaultData = () => ({ exercises: PRESET_EXERCISES, workouts: [], routines: [], unit: "kg", active: null, friends: [] });
const loadData = (user) => ({ ...defaultData(), ...(store.get("liftlog:data:" + user) || {}) });

function Login({ onLogin }) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState(() => store.get("liftlog:lastUser") || "");
  const [pin, setPin] = useState("");
  const [remember, setRemember] = useState(true);
  const [error, setError] = useState("");

  const switchMode = (m) => { setMode(m); setError(""); setPin(""); };

  const submit = (e) => {
    e.preventDefault();
    const u = name.trim().toLowerCase();
    if (!u) return setError("Enter your username.");
    if (!/^\d{4,6}$/.test(pin)) return setError("Your PIN is 4 to 6 digits.");
    const users = store.get("liftlog:users") || {};
    const h = hashPin(pin);
    if (mode === "create") {
      if (users[u]) return setError("That username is taken. Switch to Log in.");
      users[u] = h;
      store.set("liftlog:users", users);
    } else {
      if (!users[u]) return setError('No account called "' + u + '". Create one first.');
      if (users[u] !== h) return setError("Wrong PIN for this username.");
    }
    store.set("liftlog:lastUser", u);
    // Remember me: keep the session on this device so the app opens straight away next time.
    // Untick it and you'll see the login screen on every fresh visit.
    if (remember) store.set("liftlog:session", u);
    else store.del("liftlog:session");
    onLogin(u);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", backgroundImage: BG_PATTERN, color: "#e5e7eb", fontFamily: FONT_BODY, padding: 16, boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <form onSubmit={submit} noValidate style={{ width: "100%", maxWidth: 360, clipPath: OCTA, borderLeft: "3px solid #dc2626", background: "#141414", padding: 20 }}>
        <HazardBar />
        <h1 style={{ fontSize: 34, margin: "0 0 4px", color: "#fafafa" }}>Iron Jungle</h1>
        <p style={{ color: "#a1a1aa", fontSize: 15, marginTop: 0, marginBottom: 16 }}>
          {mode === "login" ? "Log in to your account." : "Create an account. Your PIN is what you'll type to log in."}
        </p>
        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
          <Btn type="button" variant={mode === "login" ? "primary" : "ghost"} onClick={() => switchMode("login")} style={{ flex: 1 }}>Log in</Btn>
          <Btn type="button" variant={mode === "create" ? "primary" : "ghost"} onClick={() => switchMode("create")} style={{ flex: 1 }}>Create account</Btn>
        </div>
        <label style={labelStyle} htmlFor="login-user">Username</label>
        <input id="login-user" autoComplete="username" autoCapitalize="none" value={name} onChange={(e) => { setName(e.target.value); setError(""); }} style={{ ...inputStyle, marginBottom: 10 }} />
        <label style={labelStyle} htmlFor="login-pin">PIN (4 to 6 digits)</label>
        <input id="login-pin" type="password" inputMode="numeric" autoComplete={mode === "create" ? "new-password" : "current-password"} value={pin} onChange={(e) => { setPin(e.target.value.replace(/\D/g, "").slice(0, 6)); setError(""); }} style={{ ...inputStyle, marginBottom: 12 }} />
        <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 15, marginBottom: 12, cursor: "pointer" }}>
          <input type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)} style={{ width: 20, height: 20, margin: 0 }} />
          Remember me on this device
        </label>
        {error && <p role="alert" style={{ color: "#f87171", fontSize: 15, margin: "0 0 12px" }}>{error}</p>}
        <Btn type="submit" style={{ width: "100%" }}>{mode === "login" ? "Log in" : "Create account"}</Btn>
        <p style={{ color: "#71717a", fontSize: 13, marginBottom: 0, marginTop: 12 }}>Accounts and workouts are saved on this device only.</p>
      </form>
    </div>
  );
}

// ---------- Friends & monthly awards ----------
const monthOf = (d) => d.slice(0, 7);
const currentMonth = () => today().slice(0, 7);
const e1rmOf = (sets) => (sets.length ? Math.max(...sets.map((s) => e1rm(s.weight, s.reps))) : 0);

// Converts this app's local workout records into the generic shape used for
// summaries, by resolving each exerciseId to its name/muscle/equipment.
function toGeneric(workouts, exercises) {
  return workouts.map((w) => ({
    date: w.date,
    exercises: w.exercises.map((we) => {
      const ex = exercises.find((e) => e.id === we.exerciseId);
      return {
        name: ex?.name || "Deleted exercise",
        muscle: ex?.muscle || "Other",
        equipment: ex?.equipment || "Other",
        sets: we.sets,
      };
    }),
  }));
}

// Summary of one person's month, computed from generic entries
// ({ date, exercises: [{ name, muscle, equipment, sets }] }).
// Only aggregates are ever shared, never individual sets.
function computeSummary(name, month, entries) {
  const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
  const inMonth = sorted.filter((w) => monthOf(w.date) === month);
  const before = sorted.filter((w) => monthOf(w.date) < month);

  const baseline = {};
  before.forEach((w) => w.exercises.forEach((we) => {
    baseline[we.name] = Math.max(baseline[we.name] ?? 0, e1rmOf(we.sets));
  }));

  let volume = 0, prs = 0;
  const running = { ...baseline };
  const monthBest = {};
  const names = new Set();
  const equip = new Set();
  inMonth.forEach((w) => w.exercises.forEach((we) => {
    const cur = e1rmOf(we.sets);
    we.sets.forEach((st) => { volume += st.weight * st.reps; });
    names.add(we.name);
    if (we.equipment) equip.add(we.equipment);
    if (we.name in running && cur > running[we.name]) prs++;
    running[we.name] = Math.max(running[we.name] ?? 0, cur);
    monthBest[we.name] = Math.max(monthBest[we.name] ?? 0, cur);
  }));

  const gains = Object.keys(monthBest)
    .filter((n) => baseline[n] > 0)
    .map((n) => ((monthBest[n] - baseline[n]) / baseline[n]) * 100);
  const gain = gains.length ? gains.reduce((a, b) => a + b, 0) / gains.length : 0;

  return {
    name,
    month,
    sessions: inMonth.length,
    volume: Math.round(volume),
    prs,
    gain: Math.round(gain * 10) / 10,
    exercises: names.size,
    equipment: equip.size,
    diversity: equip.size * 100 + names.size,
  };
}

function recentMonths(n = 12) {
  const out = [];
  const d = new Date();
  d.setDate(1);
  for (let i = 0; i < n; i++) {
    out.push(d.toISOString().slice(0, 7));
    d.setMonth(d.getMonth() - 1);
  }
  return out;
}

// ---------- Cloud sync (Supabase): real-time groups and leaderboards ----------
const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0";

// Built-in project settings. These are public values: the database's Row Level Security
// rules control what anyone can read or write. Never put a service_role key here.
const DEFAULT_CLOUD = {
  url: "https://vtyzinxueylxzdefujcz.supabase.co",
  anonKey: "sb_publishable_94KnGI5QVQOq7_5SUe45lg_p37rGR93",
};

function loadSupabaseLib() {
  return new Promise((resolve, reject) => {
    if (window.supabase && window.supabase.createClient) return resolve(window.supabase);
    let script = document.querySelector("script[data-supabase-lib]");
    if (!script) {
      script = document.createElement("script");
      script.src = SUPABASE_CDN;
      script.dataset.supabaseLib = "true";
      document.head.appendChild(script);
    }
    script.addEventListener("load", () => resolve(window.supabase));
    script.addEventListener("error", () => reject(new Error("Could not load the Supabase library. Check your connection.")));
  });
}

function useCloud(username) {
  const [config, setConfigState] = useState(() => ({ ...DEFAULT_CLOUD, ...(store.get("liftlog:cloud") || {}) }));
  const [client, setClient] = useState(null);
  const [status, setStatus] = useState("idle"); // idle | connecting | connected | error
  const [error, setError] = useState("");
  const [userId, setUserId] = useState(null);
  const [group, setGroup] = useState(null); // { id, name, code }
  const [members, setMembers] = useState([]); // [{ user_id, username }]
  const [busy, setBusy] = useState(false);

  const setConfig = (next) => { setConfigState(next); store.set("liftlog:cloud", next); };

  const refreshGroup = async (sb, uid) => {
    const { data } = await sb.from("group_members").select("group_id, groups ( id, name, code )").eq("user_id", uid).limit(1);
    if (!data || !data.length || !data[0].groups) { setGroup(null); setMembers([]); return; }
    const g = data[0].groups;
    setGroup(g);
    const { data: mem } = await sb.from("group_members").select("user_id, username").eq("group_id", g.id);
    setMembers(mem || []);
  };

  const connect = async () => {
    if (!config.url.trim() || !config.anonKey.trim()) { setError("Enter both the project URL and anon key."); return; }
    setStatus("connecting"); setError("");
    try {
      const lib = await loadSupabaseLib();
      const sb = lib.createClient(config.url.trim(), config.anonKey.trim(), { auth: { persistSession: false, autoRefreshToken: true } });
      const sessionKey = "liftlog:cloud:session:" + username;
      const saved = store.get(sessionKey);
      let session = null;
      if (saved) {
        const { data } = await sb.auth.setSession(saved);
        session = data?.session || null;
      }
      if (!session) {
        const { data, error: aErr } = await sb.auth.signInAnonymously();
        if (aErr) throw aErr;
        session = data.session;
      }
      store.set(sessionKey, { access_token: session.access_token, refresh_token: session.refresh_token });
      const { error: pErr } = await sb.from("profiles").upsert({ id: session.user.id, username });
      if (pErr) throw pErr;
      setClient(sb);
      setUserId(session.user.id);
      setStatus("connected");
      await refreshGroup(sb, session.user.id);
    } catch (e) {
      setStatus("error");
      setError(e.message || "Could not connect. Check your project URL and anon key.");
    }
  };

  const disconnect = () => { setClient(null); setUserId(null); setGroup(null); setMembers([]); setStatus("idle"); };

  const createGroup = async (name) => {
    if (!client || !userId || !name.trim()) return;
    setBusy(true); setError("");
    try {
      const code = Math.random().toString(36).slice(2, 8).toUpperCase();
      const { data, error: e1 } = await client.from("groups").insert({ name: name.trim(), code, created_by: userId }).select().single();
      if (e1) throw e1;
      const { error: e2 } = await client.from("group_members").insert({ group_id: data.id, user_id: userId, username });
      if (e2) throw e2;
      await refreshGroup(client, userId);
    } catch (e) { setError(e.message || "Could not create the group."); }
    setBusy(false);
  };

  const joinGroup = async (code) => {
    if (!client || !userId || !code.trim()) return;
    setBusy(true); setError("");
    try {
      const { data, error: e1 } = await client.from("groups").select("*").eq("code", code.trim().toUpperCase()).maybeSingle();
      if (e1) throw e1;
      if (!data) { setError("No group with that code."); setBusy(false); return; }
      const { error: e2 } = await client.from("group_members").insert({ group_id: data.id, user_id: userId, username });
      if (e2) throw e2;
      await refreshGroup(client, userId);
    } catch (e) { setError(e.message || "Could not join that group."); }
    setBusy(false);
  };

  const leaveGroup = async () => {
    if (!client || !userId || !group) return;
    setBusy(true); setError("");
    try {
      await client.from("group_members").delete().eq("user_id", userId).eq("group_id", group.id);
      setGroup(null); setMembers([]);
    } catch (e) { setError(e.message || "Could not leave the group."); }
    setBusy(false);
  };

  const pushWorkout = async (workout, exercises) => {
    if (!client || !userId || !group) return;
    try {
      const generic = workout.exercises.map((we) => {
        const ex = exercises.find((e) => e.id === we.exerciseId);
        return {
          name: ex?.name || "Deleted exercise",
          muscle: ex?.muscle || "Other",
          equipment: ex?.equipment || "Other",
          sets: we.sets,
        };
      });
      const volume = generic.reduce((sum, e) => sum + e.sets.reduce((s, x) => s + x.weight * x.reps, 0), 0);
      await client.from("cloud_workouts").insert({
        user_id: userId, group_id: group.id, username, date: workout.date, exercises: generic, total_volume: Math.round(volume),
      });
    } catch (e) { /* non-fatal: the workout is already saved locally */ }
  };

  const fetchLeaderboard = async (month) => {
    if (!client || !group || !members.length) return [];
    const ids = members.map((m) => m.user_id);
    const { data, error: e1 } = await client.from("cloud_workouts").select("user_id, username, date, exercises").in("user_id", ids);
    if (e1) { setError(e1.message); return []; }
    const byUser = {};
    (data || []).forEach((row) => {
      (byUser[row.user_id] ||= { username: row.username, entries: [] }).entries.push({ date: row.date, exercises: row.exercises });
    });
    return members.map((m) => {
      const u = byUser[m.user_id] || { username: m.username, entries: [] };
      return computeSummary(u.username, month, u.entries);
    });
  };

  return { config, setConfig, status, error, client, userId, group, members, busy, connect, disconnect, createGroup, joinGroup, leaveGroup, pushWorkout, fetchLeaderboard };
}

function CloudGroupPanel({ cloud, username }) {
  const [month, setMonth] = useState(currentMonth());
  const [showAdvanced, setShowAdvanced] = useState(false);

  useEffect(() => {
    if (cloud.status === "idle" && cloud.config.url && cloud.config.anonKey) cloud.connect();
  }, []);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);
  const [groupName, setGroupName] = useState("");
  const [joinCode, setJoinCode] = useState("");

  useEffect(() => {
    if (cloud.status !== "connected" || !cloud.group) { setRows([]); return; }
    let alive = true;
    setLoading(true);
    cloud.fetchLeaderboard(month).then((r) => { if (alive) { setRows(r); setLoading(false); } });
    return () => { alive = false; };
  }, [cloud.status, cloud.group, cloud.members, month]);

  if (cloud.status !== "connected" && cloud.status !== "error") {
    return (
      <Card>
        <p style={{ margin: 0, color: "#a1a1aa" }}>Connecting to your group…</p>
      </Card>
    );
  }

  if (cloud.status === "error" && !showAdvanced) {
    return (
      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Couldn't connect</h3>
        <p role="alert" style={{ color: "#f87171", fontSize: 14, marginTop: 0 }}>{cloud.error}</p>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn onClick={cloud.connect} style={{ flex: 1 }}>Try again</Btn>
          <Btn variant="ghost" onClick={() => setShowAdvanced(true)} style={{ flex: 1 }}>Advanced</Btn>
        </div>
      </Card>
    );
  }

  if (cloud.status === "error" && showAdvanced) {
    return (
      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Advanced connection settings</h3>
        <p style={{ color: "#9ca3af", fontSize: 13, marginTop: 0 }}>
          Only change these if you're using a different Supabase project. See the setup guide.
        </p>
        <label style={labelStyle} htmlFor="sb-url">Project URL</label>
        <input id="sb-url" placeholder="https://xxxx.supabase.co" value={cloud.config.url} onChange={(e) => cloud.setConfig({ ...cloud.config, url: e.target.value })} style={{ ...inputStyle, marginBottom: 10 }} />
        <label style={labelStyle} htmlFor="sb-key">Anon public key</label>
        <input id="sb-key" placeholder="eyJhbGciOi..." value={cloud.config.anonKey} onChange={(e) => cloud.setConfig({ ...cloud.config, anonKey: e.target.value })} style={{ ...inputStyle, marginBottom: 12 }} />
        {cloud.error && <p role="alert" style={{ color: "#f87171", fontSize: 14, margin: "0 0 12px" }}>{cloud.error}</p>}
        <Btn onClick={cloud.connect} disabled={cloud.status === "connecting"} style={{ width: "100%" }}>
          {cloud.status === "connecting" ? "Connecting…" : "Connect"}
        </Btn>
      </Card>
    );
  }

  if (!cloud.group) {
    return (
      <>
        <Card>
          <p style={{ margin: 0, fontSize: 13, color: "#9ca3af" }}>Connected as {username}. You're not in a group yet.</p>
        </Card>
        <Card>
          <h3 style={{ marginTop: 0, fontSize: 16 }}>Create a group</h3>
          <input placeholder="e.g. Berlin Barbell Bros" value={groupName} onChange={(e) => setGroupName(e.target.value)} style={{ ...inputStyle, marginBottom: 8 }} />
          <Btn disabled={!groupName.trim() || cloud.busy} onClick={() => cloud.createGroup(groupName)} style={{ width: "100%" }}>Create group</Btn>
        </Card>
        <Card>
          <h3 style={{ marginTop: 0, fontSize: 16 }}>Join with a code</h3>
          <input placeholder="e.g. 7K2P9A" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} style={{ ...inputStyle, marginBottom: 8 }} />
          {cloud.error && <p role="alert" style={{ color: "#f87171", fontSize: 14, margin: "0 0 8px" }}>{cloud.error}</p>}
          <Btn disabled={!joinCode.trim() || cloud.busy} onClick={() => cloud.joinGroup(joinCode)} style={{ width: "100%" }}>Join group</Btn>
        </Card>
      </>
    );
  }

  const sorted = [...rows].sort((a, b) => b.sessions - a.sessions || b.volume - a.volume);
  const fmtVol = (kg) => `${Math.round(kg).toLocaleString()} kg`;

  return (
    <>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 16 }}>{cloud.group.name}</div>
            <div style={{ fontSize: 12, color: "#9ca3af" }}>Invite code: {cloud.group.code} · {cloud.members.length} member{cloud.members.length === 1 ? "" : "s"}</div>
          </div>
          <Btn variant="ghost" onClick={cloud.leaveGroup} style={{ color: "#f87171" }}>Leave</Btn>
        </div>
      </Card>
      <Card>
        <label style={labelStyle} htmlFor="group-month">Month</label>
        <select id="group-month" value={month} onChange={(e) => setMonth(e.target.value)} style={inputStyle}>
          {recentMonths().map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      </Card>
      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Leaderboard · {monthLabel(month)}</h3>
        {loading && <p style={{ color: "#9ca3af" }}>Loading…</p>}
        {!loading && sorted.map((m, i) => (
          <div key={m.name} style={{ padding: "10px 0", borderBottom: "1px solid #27272a" }}>
            <div style={{ fontSize: 15 }}>{i + 1}. {m.name}{m.name === username ? " (you)" : ""}</div>
            <div style={{ fontSize: 12, color: "#9ca3af", marginTop: 2 }}>
              {m.sessions} sessions · {fmtVol(m.volume)} · {m.prs} PRs · {m.gain >= 0 ? "+" : ""}{m.gain}% strength · {m.equipment} equipment types · {m.exercises} exercises
            </div>
          </div>
        ))}
      </Card>
      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Monthly awards</h3>
        {rows.length < 2 && <p style={{ color: "#9ca3af", fontSize: 14, marginTop: 0 }}>Awards unlock once at least 2 members have logged a workout this month.</p>}
        {AWARD_DEFS.map((def) => {
          const w = awardWinners(rows, def);
          return (
            <div key={def.title} style={{ padding: "8px 0", borderBottom: "1px solid #27272a" }}>
              <div style={{ fontSize: 15, color: "#dc2626", fontWeight: 600 }}>{def.title}</div>
              <div style={{ fontSize: 12, color: "#9ca3af" }}>{def.desc}</div>
              <div style={{ fontSize: 14, marginTop: 2 }}>{rows.length >= 2 && w.length ? w.join(", ") : "No winner yet"}</div>
            </div>
          );
        })}
      </Card>
    </>
  );
}

const SHARE_PREFIX = "LIFT1:";
const encodeSummary = (sum) => SHARE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(sum))));
function decodeSummary(code) {
  try {
    if (!code.startsWith(SHARE_PREFIX)) return null;
    const o = JSON.parse(decodeURIComponent(escape(atob(code.slice(SHARE_PREFIX.length)))));
    const ok = typeof o.name === "string" && /^\d{4}-\d{2}$/.test(o.month) &&
      ["sessions", "volume", "prs", "gain", "exercises", "equipment", "diversity"].every((k) => typeof o[k] === "number");
    return ok ? o : null;
  } catch (e) { return null; }
}

const AWARD_DEFS = [
  { title: "Gym Rat", desc: "Most gym sessions", key: "sessions", high: true },
  { title: "Heavy Lifter", desc: "Most total volume lifted", key: "volume", high: true },
  { title: "Lazy Ass", desc: "Fewest gym sessions", key: "sessions", high: false },
  { title: "PR Machine", desc: "Most personal records set", key: "prs", high: true },
  { title: "Most Improved", desc: "Biggest average strength gain (%)", key: "gain", high: true },
  { title: "Hybrid Athlete", desc: "Most varied training (equipment and exercises)", key: "diversity", high: true },
];

// Returns winner names for an award. Needs at least 2 people to be fair.
function awardWinners(members, def) {
  if (members.length < 2) return [];
  const vals = members.map((m) => m[def.key]);
  const target = def.high ? Math.max(...vals) : Math.min(...vals);
  if (def.high && target <= 0) return [];
  return members.filter((m) => m[def.key] === target).map((m) => m.name);
}

const monthLabel = (m) => new Date(m + "-01").toLocaleDateString(undefined, { month: "long", year: "numeric" });

function FriendsTab({ username, workouts, exercises, friends, setFriends, unit, cloud }) {
  const months = useMemo(() => {
    const set = new Set([currentMonth()]);
    workouts.forEach((w) => set.add(monthOf(w.date)));
    friends.forEach((f) => set.add(f.month));
    return [...set].sort().reverse();
  }, [workouts, friends]);

  const [month, setMonth] = useState(currentMonth());
  const [code, setCode] = useState("");
  const [err, setErr] = useState("");
  const [shareCode, setShareCode] = useState("");

  const mine = computeSummary(username, month, toGeneric(workouts, exercises));
  const members = [mine, ...friends.filter((f) => f.month === month)];
  const sorted = [...members].sort((a, b) => b.sessions - a.sessions || b.volume - a.volume);
  const fmtVol = (kg) => `${Math.round(unit === "kg" ? kg : kg * 2.20462).toLocaleString()} ${unit}`;

  const addFriend = () => {
    const sum = decodeSummary(code.trim());
    if (!sum) return setErr("That code isn't valid. Ask your friend to copy it again from their Friends tab.");
    if (sum.name === username) return setErr("That's your own code.");
    setFriends((prev) => [...prev.filter((f) => !(f.name === sum.name && f.month === sum.month)), sum]);
    setCode("");
    setErr("");
  };
  const removeFriend = (name, m) => setFriends((prev) => prev.filter((f) => !(f.name === name && f.month === m)));

  return (
    <>
      <CloudGroupPanel cloud={cloud} username={username} />
      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>No server set up? Share codes by hand instead</h3>
        <p style={{ color: "#9ca3af", fontSize: 13, marginTop: 0, marginBottom: 0 }}>
          This works without any setup: generate a text code for the month below and send it to a friend (and vice versa). It only shares totals, never individual sets.
        </p>
      </Card>
      <Card>
        <label style={labelStyle} htmlFor="fr-month">Month</label>
        <select id="fr-month" value={month} onChange={(e) => setMonth(e.target.value)} style={inputStyle}>
          {months.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      </Card>

      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Leaderboard · {monthLabel(month)}</h3>
        {sorted.map((m, i) => (
          <div key={m.name + m.month} style={{ padding: "10px 0", borderBottom: "1px solid #27272a" }}>
            <div style={{ fontSize: 15 }}>{i + 1}. {m.name}{m.name === username ? " (you)" : ""}</div>
            <div style={{ fontSize: 12, color: "#9ca3af", marginTop: 2 }}>
              {m.sessions} sessions · {fmtVol(m.volume)} · {m.prs} PRs · {m.gain >= 0 ? "+" : ""}{m.gain}% strength · {m.equipment} equipment types · {m.exercises} exercises
            </div>
          </div>
        ))}
      </Card>

      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Monthly awards</h3>
        {members.length < 2 && <p style={{ color: "#9ca3af", fontSize: 14, marginTop: 0 }}>Add at least one friend's code for this month to unlock awards.</p>}
        {AWARD_DEFS.map((def) => {
          const w = awardWinners(members, def);
          return (
            <div key={def.title} style={{ padding: "8px 0", borderBottom: "1px solid #27272a" }}>
              <div style={{ fontSize: 15, color: "#dc2626", fontWeight: 600 }}>{def.title}</div>
              <div style={{ fontSize: 12, color: "#9ca3af" }}>{def.desc}</div>
              <div style={{ fontSize: 14, marginTop: 2 }}>{members.length >= 2 && w.length ? w.join(", ") : "No winner yet"}</div>
            </div>
          );
        })}
      </Card>

      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Share my summary</h3>
        <p style={{ color: "#9ca3af", fontSize: 13, marginTop: 0 }}>Shares only totals for the month: sessions, volume, PRs, strength gain and variety. No individual sets.</p>
        <Btn variant="ghost" onClick={() => setShareCode(encodeSummary(mine))} style={{ width: "100%", marginBottom: 8 }}>Create my code for {monthLabel(month)}</Btn>
        {shareCode && (
          <textarea readOnly value={shareCode} onFocus={(e) => e.target.select()} rows={3} aria-label="Your share code" style={{ ...inputStyle, height: "auto", padding: 10, fontSize: 13, wordBreak: "break-all" }} />
        )}
      </Card>

      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Add a friend</h3>
        <label style={labelStyle} htmlFor="fr-code">Paste their code</label>
        <textarea id="fr-code" rows={3} value={code} onChange={(e) => { setCode(e.target.value); setErr(""); }} style={{ ...inputStyle, height: "auto", padding: 10, fontSize: 13, marginBottom: 8 }} />
        {err && <p role="alert" style={{ color: "#f87171", fontSize: 14, margin: "0 0 8px" }}>{err}</p>}
        <Btn disabled={!code.trim()} onClick={addFriend} style={{ width: "100%" }}>Add friend</Btn>
      </Card>

      <Card>
        <h3 style={{ marginTop: 0, fontSize: 16 }}>Friends for {monthLabel(month)}</h3>
        {friends.filter((f) => f.month === month).length === 0 && <p style={{ color: "#9ca3af", fontSize: 14, marginTop: 0 }}>No friends added for this month yet.</p>}
        {friends.filter((f) => f.month === month).map((f) => (
          <div key={f.name} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: "1px solid #27272a" }}>
            <div style={{ flex: 1, fontSize: 15 }}>{f.name}</div>
            <Btn variant="ghost" onClick={() => removeFriend(f.name, f.month)} style={{ minWidth: 70, padding: "0 10px", color: "#f87171" }}>Remove</Btn>
          </div>
        ))}

}

// ---------- Main App ----------
function Tracker({ username, initial, onSave, onLogout }) {
  const [exercises, setExercises] = useState(initial.exercises);
  const [workouts, setWorkouts] = useState(initial.workouts);
  const [tab, setTab] = useState("log");
  const [active, setActive] = useState(initial.active); // in-progress workout
  const [selectedEx, setSelectedEx] = useState("bench");
  const [unit, setUnit] = useState(initial.unit);
  const [pickedRaw, setPicked] = useState([]);
  // Only exercises that still exist on the Exercises page can be selected
  const picked = pickedRaw.filter((id) => exercises.some((e) => e.id === id));
  const [form, setForm] = useState({ name: "", muscle: "Chest", equipment: "Barbell" });
  const [editingId, setEditingId] = useState(null);
  const [routines, setRoutines] = useState(initial.routines);
  const [friends, setFriends] = useState(initial.friends || []); // saved workouts: { id, name, exerciseIds }
  const [routineName, setRoutineName] = useState("");
  const cloud = useCloud(username);

  const saveRoutine = () => {
    const name = routineName.trim();
    if (!name || !validPicked.length) return;
    setRoutines((r) => [...r, { id: uid(), name, exerciseIds: validPicked }]);
    setRoutineName("");
  };
  const deleteRoutine = (id) => setRoutines((r) => r.filter((x) => x.id !== id));

  useEffect(() => {
    onSave({ exercises, workouts, routines, unit, active, friends });
  }, [exercises, workouts, routines, unit, active, friends]);

  const resetForm = () => {
    setForm({ name: "", muscle: "Chest", equipment: "Barbell" });
    setEditingId(null);
  };
  const saveExercise = () => {
    const clean = { ...form, name: form.name.trim() };
    if (!clean.name) return;
    if (editingId) {
      setExercises(exercises.map((e) => (e.id === editingId ? { ...e, ...clean } : e)));
    } else {
      setExercises([...exercises, { id: uid(), ...clean }]);
    }
    resetForm();
  };
  const startEdit = (e) => {
    setEditingId(e.id);
    setForm({ name: e.name, muscle: e.muscle, equipment: e.equipment });
  };
  const deleteExercise = (id) => {
    setExercises(exercises.filter((e) => e.id !== id));
    if (editingId === id) resetForm();
  };

  const exById = (id) => exercises.find((e) => e.id === id);
  const lastSetsFor = (exId) => {
    const sorted = [...workouts].sort((a, b) => b.date.localeCompare(a.date));
    for (const w of sorted) {
      const we = w.exercises.find((e) => e.exerciseId === exId);
      if (we) return we.sets;
    }
    return null;
  };

  // Start workout: pre-fill from last session
  const startWorkout = (exIds) => {
    const valid = exIds.filter((id) => exercises.some((e) => e.id === id));
    const exs = valid.map((exerciseId) => {
      const last = lastSetsFor(exerciseId);
      const sets = last
        ? last.map((s) => ({ weight: s.weight, reps: s.reps, done: false }))
        : [{ weight: 20, reps: 8, done: false }];
      return { exerciseId, sets };
    });
    setActive({ id: uid(), date: today(), exercises: exs });
    setTab("log");
  };

  const addExerciseToActive = (exerciseId) => {
    const last = lastSetsFor(exerciseId);
    const sets = last
      ? last.map((s) => ({ weight: s.weight, reps: s.reps, done: false }))
      : [{ weight: 20, reps: 8, done: false }];
    setActive((a) => ({ ...a, exercises: [...a.exercises, { exerciseId, sets }] }));
  };

  const removeExerciseFromActive = (exIdx) => {
    setActive((a) => ({ ...a, exercises: a.exercises.filter((_, i) => i !== exIdx) }));
  };

  const validPicked = picked.filter((id) => exercises.some((e) => e.id === id));

  const togglePicked = (id) => {
    setPicked((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  };

  const updateSet = (exIdx, setIdx, patch) => {
    setActive((a) => {
      const copy = structuredClone(a);
      Object.assign(copy.exercises[exIdx].sets[setIdx], patch);
      return copy;
    });
  };

  const addSet = (exIdx) => {
    setActive((a) => {
      const copy = structuredClone(a);
      const prev = copy.exercises[exIdx].sets.slice(-1)[0] || { weight: 0, reps: 0 };
      copy.exercises[exIdx].sets.push({ weight: prev.weight, reps: prev.reps, done: false });
      return copy;
    });
  };

  const finishWorkout = () => {
    const cleaned = {
      ...active,
      exercises: active.exercises
        .map((e) => ({ ...e, sets: e.sets.filter((s) => s.done) }))
        .filter((e) => e.sets.length > 0),
    };
    if (cleaned.exercises.length) {
      setWorkouts((w) => [...w, cleaned]);
      cloud.pushWorkout(cleaned, exercises);
    }
    setActive(null);
    setTab("history");
  };

  // ----- Analytics -----
  const progressPoints = useMemo(() => {
    return [...workouts]
      .sort((a, b) => a.date.localeCompare(b.date))
      .flatMap((w) => {
        const we = w.exercises.find((e) => e.exerciseId === selectedEx);
        if (!we) return [];
        const best = Math.max(...we.sets.map((s) => e1rm(s.weight, s.reps)));
        return [{ date: w.date, value: best }];
      });
  }, [workouts, selectedEx]);

  const prs = useMemo(() => {
    const map = {};
    workouts.forEach((w) =>
      w.exercises.forEach((we) =>
        we.sets.forEach((s) => {
          const est = e1rm(s.weight, s.reps);
          const cur = map[we.exerciseId];
          if (!cur || est > cur.value) map[we.exerciseId] = { value: est, weight: s.weight, reps: s.reps, date: w.date };
        })
      )
    );
    return Object.entries(map).map(([id, v]) => ({ id, ...v })).sort((a, b) => b.value - a.value);
  }, [workouts]);

  const weeklyVolume = useMemo(() => {
    const byMuscle = {};
    workouts.forEach((w) => {
      const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
      if (new Date(w.date) < weekAgo) return;
      w.exercises.forEach((we) => {
        const m = exById(we.exerciseId)?.muscle || "Other";
        const vol = we.sets.reduce((sum, s) => sum + s.weight * s.reps, 0);
        byMuscle[m] = (byMuscle[m] || 0) + vol;
      });
    });
    return Object.entries(byMuscle).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
  }, [workouts, exercises]);

  const consistency = useMemo(() => {
    const days = new Set(workouts.map((w) => w.date));
    let streak = 0;
    const d = new Date();
    while (days.has(d.toISOString().slice(0, 10))) { streak++; d.setDate(d.getDate() - 1); }
    return { total: workouts.length, streak, perWeek: (workouts.length / Math.max(1, 8)).toFixed(1) };
  }, [workouts]);

  const tabs = [["log", "Log"], ["history", "History"], ["progress", "Progress"], ["friends", "Friends"], ["library", "Exercises"]];
  const display = (kg) => (unit === "kg" ? kg : kg * 2.20462);

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", backgroundImage: BG_PATTERN, color: "#e5e7eb", fontFamily: FONT_BODY, padding: 16, boxSizing: "border-box" }}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        <HazardBar />
        <header style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <h1 style={{ fontSize: 34, margin: 0, color: "#fafafa" }}>Iron Jungle <span style={{ fontSize: 16, color: "#a1a1aa", fontWeight: 400, letterSpacing: "0.04em" }}>// {username}</span></h1>
          <Btn variant="ghost" onClick={() => setUnit(unit === "kg" ? "lb" : "kg")} style={{ minHeight: 40 }}>
            Units: {unit}
          </Btn>
          <Btn variant="ghost" onClick={onLogout} style={{ minHeight: 40, marginLeft: 6 }}>Log out</Btn>
        </header>

        <nav style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto" }} aria-label="Main">
          {tabs.map(([k, label]) => (
            <Btn key={k} variant={tab === k ? "primary" : "ghost"} onClick={() => setTab(k)} style={{ flex: 1, minHeight: 44 }}>
              {label}
            </Btn>
          ))}
        </nav>

        {tab === "log" && !active && (
          <Card>
            <h2 style={{ fontSize: 18, marginTop: 0 }}>Saved workouts</h2>
            {routines.length === 0 && (
              <p style={{ color: "#9ca3af", fontSize: 14, marginTop: 0 }}>No saved workouts yet. Pick exercises below, name them, and save.</p>
            )}
            {routines.map((r) => {
              const count = r.exerciseIds.filter((id) => exercises.some((e) => e.id === id)).length;
              return (
                <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: "1px solid #27272a" }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 15 }}>{r.name}</div>
                    <div style={{ fontSize: 12, color: "#9ca3af" }}>{count} exercise{count === 1 ? "" : "s"}</div>
                  </div>
                  <Btn onClick={() => startWorkout(r.exerciseIds)} disabled={!count} style={{ minWidth: 70, padding: "0 12px" }}>Start</Btn>
                  <Btn variant="ghost" onClick={() => deleteRoutine(r.id)} style={{ minWidth: 60, padding: "0 10px", color: "#f87171" }}>Delete</Btn>
                </div>
              );
            })}

            <h2 style={{ fontSize: 18, marginTop: 16 }}>Choose exercises</h2>
            <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
              {MUSCLES.filter((m) => exercises.some((e) => e.muscle === m)).map((m) => (
                <Btn
                  key={m}
                  variant="ghost"
                  onClick={() => setPicked((p) => [...p, ...exercises.filter((e) => e.muscle === m).map((e) => e.id).filter((id) => !p.includes(id))])}
                  style={{ fontSize: 13, minHeight: 36 }}
                >
                  + All {m}
                </Btn>
              ))}
              <Btn variant="ghost" onClick={() => setPicked([])} style={{ fontSize: 13, minHeight: 36 }}>Clear</Btn>
            </div>
            {MUSCLES.filter((m) => exercises.some((e) => e.muscle === m)).map((m) => (
              <div key={m} style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 12, color: "#9ca3af", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>{m}</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {exercises.filter((e) => e.muscle === m).map((e) => {
                    const on = validPicked.includes(e.id);
                    return (
                      <button
                        key={e.id}
                        aria-pressed={on}
                        onClick={() => togglePicked(e.id)}
                        style={{
                          minHeight: 44, padding: "0 12px", borderRadius: 0, clipPath: OCTA_SM, cursor: "pointer", fontSize: 15, textTransform: "uppercase",
                          border: on ? "1px solid #dc2626" : "1px solid #52525b",
                          background: on ? "#dc2626" : "transparent", color: on ? "#ffffff" : "#e5e7eb", fontWeight: on ? 600 : 400,
                        }}
                      >
                        {on ? "✓ " : ""}{e.name} <span style={{ opacity: 0.7 }}>· {e.equipment}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
            <div style={{ borderTop: "1px solid #27272a", paddingTop: 12, marginBottom: 12 }}>
              <label style={labelStyle} htmlFor="routine-name">Save these exercises as a workout</label>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  id="routine-name"
                  placeholder="e.g. Leg Day A"
                  value={routineName}
                  onChange={(e) => setRoutineName(e.target.value)}
                  style={{ ...inputStyle, flex: 1 }}
                />
                <Btn variant="ghost" disabled={!routineName.trim() || !validPicked.length} onClick={saveRoutine}>Save</Btn>
              </div>
            </div>
            <Btn disabled={!validPicked.length} onClick={() => startWorkout(validPicked)} style={{ width: "100%", marginTop: 4 }}>
              Start workout ({validPicked.length})
            </Btn>
          </Card>
        )}

        {tab === "log" && active && (
          <>
            {active.exercises.map((we, exIdx) => {
              const ex = exById(we.exerciseId);
              return (
                <Card key={exIdx}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <h3 style={{ margin: 0, fontSize: 17 }}>{ex?.name ?? "Deleted exercise"}</h3>
                    <Btn variant="ghost" onClick={() => removeExerciseFromActive(exIdx)} style={{ minHeight: 36, padding: "0 10px", fontSize: 13, color: "#f87171" }}>Remove</Btn>
                  </div>
                  {we.sets.map((s, setIdx) => (
                    <div key={setIdx} style={{ display: "grid", gridTemplateColumns: "28px 1fr 1fr 56px", gap: 8, alignItems: "center", marginBottom: 8 }}>
                      <span style={{ color: "#9ca3af" }}>{setIdx + 1}</span>
                      <NumInput
                        label={`Weight, set ${setIdx + 1}`}
                        value={display(s.weight)}
                        decimal
                        onCommit={(v) => updateSet(exIdx, setIdx, { weight: unit === "kg" ? v : v / 2.20462 })}
                      />
                      <NumInput
                        label={`Reps, set ${setIdx + 1}`}
                        value={s.reps}
                        onCommit={(v) => updateSet(exIdx, setIdx, { reps: Math.round(v) })}
                      />
                      <Btn variant={s.done ? "done" : "ghost"} onClick={() => updateSet(exIdx, setIdx, { done: !s.done })} style={{ minWidth: 56, padding: 0 }} >
                        {s.done ? "✓" : "Do"}
                      </Btn>
                    </div>
                  ))}
                  <Btn variant="ghost" onClick={() => addSet(exIdx)} style={{ width: "100%" }}>+ Add set</Btn>
                </Card>
              );
            })}
            <Card>
              <label style={labelStyle} htmlFor="add-ex">Add exercise to this workout</label>
              <select
                id="add-ex"
                value=""
                onChange={(e) => { if (e.target.value) addExerciseToActive(e.target.value); }}
                style={inputStyle}
              >
                <option value="">Choose an exercise…</option>
                {MUSCLES.map((m) => {
                  const inWorkout = active.exercises.map((x) => x.exerciseId);
                  const opts = exercises.filter((e) => e.muscle === m && !inWorkout.includes(e.id));
                  if (!opts.length) return null;
                  return (
                    <optgroup key={m} label={m}>
                      {opts.map((e) => <option key={e.id} value={e.id}>{e.name} · {e.equipment}</option>)}
                    </optgroup>
                  );
                })}
              </select>
            </Card>
            <Btn onClick={finishWorkout} style={{ width: "100%", minHeight: 52 }}>Finish workout</Btn>
          </>
        )}

        {tab === "history" && (
          <>
            <Card>
              <p style={{ margin: 0 }}>
                {consistency.total} workouts logged · {consistency.perWeek}/week avg · {consistency.streak}-day streak
              </p>
            </Card>
            {[...workouts].sort((a, b) => b.date.localeCompare(a.date)).map((w) => (
              <Card key={w.id}>
                <strong>{fmtDate(w.date)}</strong>
                {w.exercises.map((we, i) => {
                  const vol = we.sets.reduce((s, x) => s + x.weight * x.reps, 0);
                  return (
                    <div key={i} style={{ fontSize: 14, color: "#d1d5db", marginTop: 6 }}>
                      {(exById(we.exerciseId)?.name ?? "Deleted exercise")}: {we.sets.length} sets · {we.sets.map((s) => `${s.weight}×${s.reps}`).join(", ")} · vol {Math.round(vol)}
                    </div>
                  );
                })}
              </Card>
            ))}
          </>
        )}

        {tab === "progress" && (
          <>
            <Card>
              <label htmlFor="ex" style={{ fontSize: 14, color: "#9ca3af" }}>Exercise</label>
              <select id="ex" value={selectedEx} onChange={(e) => setSelectedEx(e.target.value)} style={{ ...inputStyle, width: "100%", marginTop: 6 }}>
                {exercises.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </Card>
            <Card>
              <h3 style={{ marginTop: 0, fontSize: 16 }}>Estimated 1RM trend ({exById(selectedEx)?.name})</h3>
              <LineChart points={progressPoints} label="Estimated 1RM over time" />
            </Card>
            <Card>
              <h3 style={{ marginTop: 0, fontSize: 16 }}>Personal records</h3>
              {prs.map((p) => (
                <div key={p.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "6px 0", borderBottom: "1px solid #27272a" }}>
                  <span>{(exById(p.id)?.name ?? "Deleted exercise")}</span>
                  <span>{Math.round(display(p.value))} est. 1RM · {p.weight}×{p.reps} · {fmtDate(p.date)}</span>
                </div>
              ))}
            </Card>
            <Card>
              <h3 style={{ marginTop: 0, fontSize: 16 }}>Volume per muscle group (last 7 days)</h3>
              {weeklyVolume.length ? <BarChart data={weeklyVolume} /> : <p style={{ color: "#9ca3af" }}>No sessions in the last 7 days.</p>}
            </Card>
          </>
        )}

        {tab === "friends" && (
          <FriendsTab username={username} workouts={workouts} exercises={exercises} friends={friends} setFriends={setFriends} unit={unit} cloud={cloud} />
        )}

        {tab === "library" && (
          <>
            <Card>
              <h3 style={{ marginTop: 0, fontSize: 16 }}>{editingId ? "Edit exercise" : "Add exercise"}</h3>
              <label style={labelStyle} htmlFor="ex-name">Name</label>
              <input
                id="ex-name"
                placeholder="e.g. Incline Dumbbell Press"
                value={form.name}
                onChange={(e) => setForm({ ...form, name: e.target.value })}
                style={{ ...inputStyle, marginBottom: 10 }}
              />
              <label style={labelStyle} htmlFor="ex-muscle">Body part</label>
              <select
                id="ex-muscle"
                value={form.muscle}
                onChange={(e) => setForm({ ...form, muscle: e.target.value })}
                style={{ ...inputStyle, marginBottom: 10 }}
              >
                {MUSCLES.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
              <label style={labelStyle} htmlFor="ex-equip">Equipment</label>
              <select
                id="ex-equip"
                value={form.equipment}
                onChange={(e) => setForm({ ...form, equipment: e.target.value })}
                style={{ ...inputStyle, marginBottom: 12 }}
              >
                {EQUIPMENT.map((q) => <option key={q} value={q}>{q}</option>)}
              </select>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn disabled={!form.name.trim()} onClick={saveExercise} style={{ flex: 1 }}>
                  {editingId ? "Save changes" : "Add exercise"}
                </Btn>
                {editingId && <Btn variant="ghost" onClick={resetForm}>Cancel</Btn>}
              </div>
            </Card>
            <Card>
              <h3 style={{ marginTop: 0, fontSize: 16 }}>Your exercises ({exercises.length})</h3>
              {exercises.map((e) => (
                <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 0", borderBottom: "1px solid #27272a" }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 15 }}>{e.name}</div>
                    <div style={{ fontSize: 12, color: "#9ca3af" }}>{e.muscle} · {e.equipment}</div>
                  </div>
                  <Btn variant="ghost" onClick={() => startEdit(e)} style={{ minWidth: 60, padding: "0 10px" }}>Edit</Btn>
                  <Btn variant="ghost" onClick={() => deleteExercise(e.id)} style={{ minWidth: 60, padding: "0 10px", color: "#f87171" }}>Delete</Btn>
                </div>
              ))}
            </Card>
          </>
        )}
      </div>
    </div>
  );
}

const labelStyle = { display: "block", fontSize: 13, color: "#9ca3af", marginBottom: 4 };

const inputStyle = {
  minHeight: 44, borderRadius: 0, border: "1px solid #52525b", background: "#1c1c1c",
  color: "#f9fafb", padding: "0 10px", fontSize: 17, letterSpacing: "0.02em", width: "100%", boxSizing: "border-box",
};

function App() {
  const [session, setSession] = useState(() => store.get("liftlog:session")); // v2: friends & awards
  const initial = useMemo(() => (session ? loadData(session) : null), [session]);

  if (!session || !initial) return (<><style>{THEME_CSS}</style><Login onLogin={setSession} /></>);
  return (
    <>
    <style>{THEME_CSS}</style>
    <Tracker
      key={session}
      username={session}
      initial={initial}
      onSave={(d) => store.set("liftlog:data:" + session, d)}
      onLogout={() => { store.del("liftlog:session"); setSession(null); }}
    />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
